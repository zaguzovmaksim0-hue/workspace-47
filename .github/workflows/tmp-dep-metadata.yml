name: Temporary dependency metadata generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VERIFY_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  JAVA_VERSION: "17"

jobs:
  dependency-metadata:
    name: Generate dependency metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERIFY_REF }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Gradle verification metadata
        run: ./gradlew --write-verification-metadata sha256 :app:verifyRuntimeDependencyLocks --no-daemon
      - name: Collect locked runtime license evidence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/reports/runtime-licenses
          ./gradlew :app:verifyRuntimeDependencyLocks --no-daemon
          for variant in optimized release; do
            ./gradlew :app:dependencies --configuration "${variant}RuntimeClasspath" --no-daemon > "app/build/reports/runtime-licenses/${variant}-graph.txt"
            python3 tools/collect_runtime_license_evidence.py \
              --cache "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1" \
              --configuration "${variant}RuntimeClasspath" \
              --output "app/build/reports/runtime-licenses/${variant}"
            python3 tools/verify_legal_bundle.py --inventory "app/build/reports/runtime-licenses/${variant}/inventory.json"
          done
      - name: Regenerate legal inventory from collected evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          legal_dir=app/src/main/assets/legal/dependencies
          mkdir -p app/build/reports/runtime-licenses "$legal_dir"
          for variant in optimized release; do
            report_dir="app/build/reports/runtime-licenses/${variant}"
            if [[ ! -s "$report_dir/inventory.json" ]]; then
              ./gradlew :app:dependencies --configuration "${variant}RuntimeClasspath" --no-daemon > "app/build/reports/runtime-licenses/${variant}-graph.txt"
              python3 tools/collect_runtime_license_evidence.py \
                --cache "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1" \
                --configuration "${variant}RuntimeClasspath" \
                --output "$report_dir"
            fi
          done
          cp app/build/reports/runtime-licenses/optimized/inventory.json "$legal_dir/inventory.json"
          shopt -s nullglob
          for notice in app/build/reports/runtime-licenses/optimized/notices/*.txt; do
            cp "$notice" "$legal_dir/"
          done
          python3 tools/build_legal_index.py
          for variant in optimized release; do
            python3 tools/verify_legal_bundle.py --inventory "app/build/reports/runtime-licenses/${variant}/inventory.json"
          done
      - name: Upload dependency metadata evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dep-metadata
          path: |
            gradle/verification-metadata.xml
            app/src/main/assets/legal/dependencies/
            app/src/main/assets/legal/documents.json
            app/src/main/assets/legal/component-licenses.json
            app/src/main/assets/legal/components.txt
            app/build/reports/runtime-licenses/
          if-no-files-found: warn
          retention-days: 1
