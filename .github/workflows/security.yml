name: Security scans

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
      - security/**
      - agent/**
      - oss/**
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history-secrets:
    name: Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks
          chmod 700 gitleaks
      - name: Verify Gitleaks detector canary
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$(mktemp -d)"
          trap 'rm -rf "$canary_dir"' EXIT
          canary_prefix='ghp_'
          canary_body='8s66JRslt6s6KPzyRF6x8AMEgRzVV8s8AcRN'
          printf 'token = "%s%s"\n' "$canary_prefix" "$canary_body" >"$canary_dir/canary.txt"
          set +e
          ./gitleaks dir "$canary_dir" --no-banner --exit-code 86 >/dev/null 2>&1
          status=$?
          set -e
          if [[ $status -ne 86 ]]; then
            echo "Gitleaks detector canary failed: expected secret-detection exit 86, got ${status}" >&2
            exit 1
          fi
      - name: Scan complete Git history across all refs
        run: ./gitleaks git --redact --no-banner --log-opts="--all" --report-format sarif --report-path gitleaks.sarif .

  dependency-vulnerabilities:
    name: OSV source dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Android runtime dependency lock
        run: ./gradlew :app:verifyRuntimeDependencyLocks --no-daemon
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Install pinned OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
      - name: Scan explicit source dependency locks
        run: >-
          osv-scanner scan source
          --lockfile app/gradle.lockfile
          --lockfile tools/requirements.txt
          --lockfile ws024-relay/go.mod
