name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
      - security/**
      - agent/**
      - oss/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GO_VERSION: "1.26.5"
  PYTHON_VERSION: "3.13"

jobs:
  android:
    name: Android unit, lint, APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify dependency metadata and portable toolchain
        run: ./gradlew verifyResolvedCoreVersion verifyPortableAapt2Configuration --no-daemon
      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest testQaUnitTest --no-daemon
      - name: Run Android lint
        run: ./gradlew lintDebug lintQa --no-daemon
      - name: Build Android APKs
        run: ./gradlew assembleDebug assembleQa assembleQaAndroidTest --no-daemon
      - name: Verify Android artifacts
        run: scripts/ci/verify-android-artifacts.sh
      - name: Verify release signing fails closed without secrets
        run: scripts/ci/verify-release-fail-closed.sh

  python:
    name: Python catalog and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Python tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v

  go:
    name: Go relay race and vulnerability gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ws024-relay
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test and race-check relay
        run: |
          go test ./... -count=1
          go test ./... -race -count=1
          go vet ./...
          go build ./cmd/ws024-relay
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...
