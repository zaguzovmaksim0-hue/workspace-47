name: Task verify

# Throwaway probe branch only: dump public portal pages as mobile Chrome sees them. Never merged.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "unused on the probe branch"
        type: string
        default: ""
        required: false

permissions:
  contents: read

jobs:
  probe:
    name: Portal DOM probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe
        timeout-minutes: 22
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd tools/probe
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.56.1 >/dev/null
          ln -s "$PWD/probe-out" "$GITHUB_WORKSPACE/probe-out"
          node dom_probe.mjs
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-dom
          path: probe-out/
          if-no-files-found: warn
          retention-days: 3
