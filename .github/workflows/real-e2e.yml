name: REAL E2E

on:
  workflow_dispatch:
    inputs:
      portal_id:
        description: Optional exact portalId or comma-separated portalIds; blank runs the entire catalog
        required: false
        type: string
      deep_auth_signing:
        description: Confirm signing only for reviewed authentication-only profiles
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: real-e2e-${{ contains(inputs.portal_id, ',') && 'batch' || inputs.portal_id || 'catalog' }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  # Chromium WebView on the SwiftShader Vulkan path can abort the whole emulator process on
  # real portal pages; keep guest Vulkan disabled so WebView renders through GLES. The runner
  # script reuses the same options when it has to restart a lost emulator mid-shard.
  REAL_E2E_EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan

jobs:
  real-e2e:
    name: Real certificate catalog E2E shard ${{ matrix.shard_number }}/${{ matrix.shard_total }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: real-e2e
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.portal_id != '' && '[{"shard_number":1,"shard_index":0,"shard_total":1}]' || '[{"shard_number":1,"shard_index":0,"shard_total":6},{"shard_number":2,"shard_index":1,"shard_total":6},{"shard_number":3,"shard_index":2,"shard_total":6},{"shard_number":4,"shard_index":3,"shard_total":6},{"shard_number":5,"shard_index":4,"shard_total":6},{"shard_number":6,"shard_index":5,"shard_total":6}]') }}
    steps:
      - name: Checkout trusted main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify trusted main ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build QA test artifacts before credentials are exposed
        run: ./gradlew assembleQa assembleQaAndroidTest --no-daemon --console=plain
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run protected real-certificate catalog E2E
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          REAL_E2E_CERT_P12_B64: ${{ secrets.REAL_E2E_CERT_P12_B64 }}
          REAL_E2E_CERT_PASSWORD: ${{ secrets.REAL_E2E_CERT_PASSWORD }}
          PORTAL_ID_FILTER: ${{ inputs.portal_id }}
          REAL_E2E_DEEP_AUTH_SIGNING: ${{ inputs.deep_auth_signing }}
          REAL_E2E_SHARD_INDEX: ${{ matrix.shard_index }}
          REAL_E2E_SHARD_TOTAL: ${{ matrix.shard_total }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: ${{ env.REAL_E2E_EMULATOR_OPTIONS }}
          script: scripts/ci/run-real-e2e.sh
      - name: Validate sanitized REAL E2E diagnostics
        id: validate-real-e2e-diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build/reports/real-e2e/progress.tsv ]]; then
            scripts/ci/real_e2e_report.py validate-progress \
              --progress build/reports/real-e2e/progress.tsv
          fi
          scripts/ci/real_e2e_report.py validate-partial-results \
            --catalog app/src/main/res/raw/public_portal_catalog_v1.json \
            --results build/reports/real-e2e/results
      - name: Publish sanitized REAL E2E shard summary
        if: always() && steps.validate-real-e2e-diagnostics.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build/reports/real-e2e/summary.md ]]; then
            cat build/reports/real-e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized REAL E2E report
        if: always() && steps.validate-real-e2e-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-e2e-sanitized-${{ github.sha }}-shard-${{ matrix.shard_number }}
          path: |
            build/reports/real-e2e/summary.json
            build/reports/real-e2e/summary.md
            build/reports/real-e2e/progress.tsv
            build/reports/real-e2e/results/
            build/reports/real-e2e/navigation/
          if-no-files-found: warn
          retention-days: 1
