name: Temporary compiler metadata review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: compiler-metadata-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiler-metadata:
    if: github.head_ref == 'maintenance/compose-compiler-2421-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Install compile platform
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Generate candidate metadata and compile all variants
        run: >-
          ./gradlew --write-verification-metadata sha256 --write-locks
          :app:verifyRuntimeDependencyLocks
          :app:compileDebugKotlin :app:compileQaKotlin
          :app:compileOptimizedKotlin :app:compileReleaseKotlin
          --no-daemon --console=plain
      - name: Collect updated runtime license evidence
        shell: bash
        run: |
          set -euo pipefail
          for variant in optimized release; do
            ./gradlew :app:dependencies --configuration "${variant}RuntimeClasspath" --no-daemon > "${variant}-graph.txt"
            python3 tools/collect_runtime_license_evidence.py \
              --cache "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1" \
              --configuration "${variant}RuntimeClasspath" \
              --output "app/build/reports/runtime-licenses/${variant}"
          done
      - name: Upload evidence for independent review (not merge approval)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-dependency-evidence
          path: |
            gradle/verification-metadata.xml
            app/gradle.lockfile
            app/build/reports/runtime-licenses/
            *-graph.txt
          if-no-files-found: error
          retention-days: 3
