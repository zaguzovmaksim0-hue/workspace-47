name: Apply protocol probe test patch

on:
  push:
    branches:
      - fix/protocol-probe-iframe-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply deterministic iframe test patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/androidTest/java/dev/junta/firmamobile/browser/ProtocolProbeInstrumentedTest.kt')
          s = p.read_text()

          new_test = '''    @Test
              fun iframeIntentIsBlockedWithoutPoisoningTheLaterTopLevelSign() {
                  val instrumentation = InstrumentationRegistry.getInstrumentation()
                  instrumentation.uiAutomation.adoptShellPermissionIdentity(Manifest.permission.DUMP)
                  try {
                      launchProbeWithoutInitialLoad().use { scenario ->
                          loadSyntheticPage(scenario, SYNTHETIC_IFRAME_THEN_MAIN_FRAME_PAGE)
                          awaitTitle(scenario, SYNTHETIC_READY_TITLE)

                          // Keep this integration test independent of the recorder's 250 ms active-call
                          // security window. The active-window/subframe invariant itself is covered by
                          // ProtocolObservationRecorderTest.subframeNativeBranchCannotConsumeTheTopLevelSignWindow.
                          evaluateJavascriptAndWait(
                              scenario,
                              "document.getElementById('probe-frame').src=" +
                                  "'intent://$IFRAME_INTENT_CANARY/#Intent;scheme=https;end';",
                          )
                          val blockedObservation = awaitStatus(scenario, "event=NAVIGATION_BLOCKED")
                          assertTrue(blockedObservation, blockedObservation.contains("event=NAVIGATION_BLOCKED"))
                          assertFalse(blockedObservation.contains("event=PROTOCOL_CORRELATION_REJECTED"))

                          evaluateJavascriptAndWait(
                              scenario,
                              "window.MiniApplet.sign(" +
                                  "'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'," +
                                  "'SHA256withRSA','CAdES','','','');",
                          )
                          val observation = awaitStatus(scenario, CORRELATED_OBSERVATION)
                          val correlatedLines = observation.lineSequence()
                              .filter { it.contains(CORRELATED_OBSERVATION) }
                              .toList()
                          assertTrue(observation, correlatedLines.isNotEmpty())
                          assertTrue(correlatedLines.all { it.contains("argument.0.length=37") })
                          assertTrue(correlatedLines.all { it.contains("correlation=REQUEST_ID") })
                          assertTrue(observation, observation.contains("event=NAVIGATION_BLOCKED"))
                          assertFalse(observation.contains("event=PROTOCOL_CORRELATION_REJECTED"))
                          assertFalse(observation.contains(IFRAME_INTENT_CANARY))
                          assertFalse(observation.contains(MAIN_FRAME_INTENT_CANARY))
                          assertHistoryExcludes(scenario, IFRAME_INTENT_CANARY, MAIN_FRAME_INTENT_CANARY)
                          assertEquals(Lifecycle.State.RESUMED, scenario.state)
                      }
                  } finally {
                      instrumentation.uiAutomation.dropShellPermissionIdentity()
                  }
              }
          '''
          # Dedent exactly four spaces introduced by this workflow's Python literal formatting.
          new_test = '\n'.join(line[4:] if line.startswith('    ') else line for line in new_test.splitlines()) + '\n'
          pattern = re.compile(
              r'    @Test\n    fun iframeIntentIsBlockedWithoutConsumingTheTopLevelSignWindow\(\) \{.*?(?=\n    @Test\n    fun standaloneIntentBeforeSignIsNeverAttachedRetroactively)',
              re.S,
          )
          s, count = pattern.subn(new_test.rstrip('\n'), s, count=1)
          assert count == 1, f'expected one iframe test replacement, got {count}'

          helper = '''
              private fun evaluateJavascriptAndWait(
                  scenario: ActivityScenario<ProtocolProbeActivity>,
                  script: String,
              ) {
                  val completed = CountDownLatch(1)
                  scenario.onActivity { activity ->
                      activity.findViewById<WebView>(R.id.protocol_probe_webview)
                          .evaluateJavascript(script) { completed.countDown() }
                  }
                  assertTrue("JavaScript evaluation timed out", completed.await(5, TimeUnit.SECONDS))
              }
          '''
          helper = '\n'.join(line[4:] if line.startswith('    ') else line for line in helper.splitlines()) + '\n'
          anchor = '\n    private fun awaitTitle(\n'
          assert anchor in s
          s = s.replace(anchor, '\n' + helper.rstrip('\n') + anchor, 1)

          title_anchor = '        const val SYNTHETIC_DONE_TITLE = "probe-flow-done"\n'
          assert title_anchor in s
          s = s.replace(
              title_anchor,
              title_anchor + '        const val SYNTHETIC_READY_TITLE = "probe-flow-ready"\n',
              1,
          )

          new_page = '''        val SYNTHETIC_IFRAME_THEN_MAIN_FRAME_PAGE = """
                      <!doctype html>
                      <iframe id="probe-frame"></iframe>
                      <script>
                        window.MiniApplet = {
                          sign: function() {
                            window.open(
                              "intent://$MAIN_FRAME_INTENT_CANARY/#Intent;scheme=https;end"
                            );
                          }
                        };
                        window.addEventListener("load", () => {
                          document.title = "$SYNTHETIC_READY_TITLE";
                        });
                      </script>
                  """.trimIndent()
          '''
          new_page = '\n'.join(line[8:] if line.startswith('        ') else line for line in new_page.splitlines()) + '\n'
          page_pattern = re.compile(
              r'        val SYNTHETIC_IFRAME_THEN_MAIN_FRAME_PAGE = """.*?        """\.trimIndent\(\)\n(?=        val SYNTHETIC_STANDALONE_THEN_SIGN_PAGE)',
              re.S,
          )
          s, count = page_pattern.subn(new_page, s, count=1)
          assert count == 1, f'expected one synthetic page replacement, got {count}'

          assert 'iframeIntentIsBlockedWithoutConsumingTheTopLevelSignWindow' not in s
          assert 'iframeIntentIsBlockedWithoutPoisoningTheLaterTopLevelSign' in s
          assert 'evaluateJavascriptAndWait' in s
          p.write_text(s)
          PY
          git diff --check
          git diff -- app/src/androidTest/java/dev/junta/firmamobile/browser/ProtocolProbeInstrumentedTest.kt
      - name: Commit patch and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-protocol-probe-patch.yml
          git add app/src/androidTest/java/dev/junta/firmamobile/browser/ProtocolProbeInstrumentedTest.kt
          git commit -m 'test(android): stabilize protocol probe iframe flow'
          git push origin HEAD:fix/protocol-probe-iframe-20260905
