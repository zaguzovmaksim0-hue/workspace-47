[extend]
useDefault = true

[[allowlists]]
description = "Public inventory surface_key values are identifiers, not API keys"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^docs/compatibility/all-spanish-public-portals-inventory\.md$''']
regexes = ['''^\s*surface_key:\s*"[a-z0-9-]+"\s*$''']
